name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The repo is private, so Actions minutes are metered, with macOS
        # counting 10x and Windows 2x. Pushes and pull requests run Linux
        # only. Windows runs too when triggered by hand, at the end of a
        # milestone. macOS is tested on the user's Mac instead.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain and components come from rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      # cpal needs the ALSA headers on Linux.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
