name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Also run on Windows (needs a Windows runner or minutes)
        type: boolean
        default: false

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on the self-hosted Raspberry Pi runner (the hosted
        # runners' minutes ran out). Windows is off until a runner for it
        # exists: tick "windows" when triggering the workflow by hand to
        # run it, at the end of a milestone. macOS is tested on the user's
        # Mac instead.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows && '[{"name":"linux","os":"Linux","runner":["self-hosted","linux-arm64"]},{"name":"windows","os":"Windows","runner":["windows-latest"]}]' || '[{"name":"linux","os":"Linux","runner":["self-hosted","linux-arm64"]}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain and components come from rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      # cpal needs the ALSA headers on Linux.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: pkg-config --exists alsa || (sudo apt-get update && sudo apt-get install -y libasound2-dev)
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
