name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info: it only slows compiling and linking (the PDBs on Windows
  # are the worst), and CI never opens a debugger.
  CARGO_PROFILE_DEV_DEBUG: 0
  # rust-cache turns this off too; say so even if the action changes.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The repo is public, so hosted runners are free on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain and components come from rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when a step fails. By default a failing job
          # skips the save, so a red Windows run started from scratch (and
          # recompiled every dependency) every time.
          cache-on-failure: true
      # cpal needs the ALSA headers on Linux.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Real third-party CLAP plugins for `noodle-plugins`' real_plugins
      # tests, and a virtual X display for their editors.
      - name: Install CLAP and VST3 plugins
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dpf-plugins-clap dragonfly-reverb-clap lsp-plugins-clap dpf-plugins-vst3 dragonfly-reverb-vst3 xvfb
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests run one binary at a time under `cargo test`; nextest schedules
      # tests from different binaries together. .config/nextest.toml holds the
      # exceptions that must still run alone.
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Real plugins' editors
        if: runner.os == 'Linux'
        env:
          NOODLE_REQUIRE_REAL_PLUGINS: '1'
        run: xvfb-run -a cargo test -p noodle-plugins --test real_plugins --test real_vst3
