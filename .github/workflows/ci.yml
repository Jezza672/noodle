name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info: it only slows compiling and linking (the PDBs on Windows
  # are the worst), and CI never opens a debugger.
  CARGO_PROFILE_DEV_DEBUG: 0
  # rust-cache turns this off too; say so even if the action changes.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The repo is public, so hosted runners are free on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Read main's scorecard artifact, and post the diff on the PR.
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # The toolchain and components come from rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when a step fails. By default a failing job
          # skips the save, so a red Windows run started from scratch (and
          # recompiled every dependency) every time.
          cache-on-failure: true
      # cpal needs the ALSA headers on Linux.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Real third-party CLAP plugins for `noodle-plugins`' real_plugins
      # tests, and a virtual X display for their editors.
      - name: Install CLAP and VST3 plugins
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dpf-plugins-clap dragonfly-reverb-clap lsp-plugins-clap dpf-plugins-vst3 dragonfly-reverb-vst3 xvfb
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The story routes already ran in the Test step. This reruns just them
      # to write the usability scorecard, which is uploaded for the PR.
      - name: Usability scorecard
        if: runner.os == 'Linux'
        env:
          NOODLE_SCORECARD_DIR: ${{ github.workspace }}/scorecard
        run: 'cargo test -p noodle-app stories::'
      - name: Upload scorecard
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: usability-scorecard
          path: scorecard/
          if-no-files-found: warn
      # The baseline is the scorecard artifact of the latest green run on
      # main (an artifact, not a committed file, so PRs never conflict on
      # it). Fork PRs get a read-only token, so they skip the comment.
      - name: Scorecard diff tests
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts
      - name: Scorecard diff
        # A failed comment call must not turn CI red.
        continue-on-error: true
        if: >-
          runner.os == 'Linux' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p baseline
          run=$(gh run list --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --name usability-scorecard --dir baseline || true
          fi
          python3 scripts/scorecard_diff.py baseline/scorecard.json scorecard/scorecard.json > diff.md
          cat diff.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- noodle-scorecard-diff -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@diff.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@diff.md
          fi
      - name: Real plugins' editors
        if: runner.os == 'Linux'
        env:
          NOODLE_REQUIRE_REAL_PLUGINS: '1'
        run: xvfb-run -a cargo test -p noodle-plugins --test real_plugins --test real_vst3
