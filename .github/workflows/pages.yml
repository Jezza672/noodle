# Publishes site-next/ (the full landing page) to GitHub Pages, served at dev.noodledaw.com.
# One-off setup in the repo: Settings > Pages > Source: GitHub Actions, custom domain dev.noodledaw.com.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site-next/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-next
      - id: deployment
        uses: actions/deploy-pages@v4
