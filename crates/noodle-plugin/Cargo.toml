[package]
name = "noodle-plugin"
description = "Noodle as a CLAP plugin: the node editor and engine inside another DAW."
version.workspace = true
edition.workspace = true
license.workspace = true

# The plugin itself is the cdylib; the rlib is for the tests and the window
# shell.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
noodle-app.workspace = true
noodle-core.workspace = true
noodle-io.workspace = true
clack-plugin = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-plugin", "params", "audio-ports", "note-ports", "state", "latency"] }

[dev-dependencies]
noodle-engine.workspace = true
noodle-nodes.workspace = true
noodle-plugins.workspace = true
base64 = "0.22"
