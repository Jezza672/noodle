[package]
name = "noodle-plugins"
description = "Plugin hosting: CLAP plugins as graph nodes."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "noodle-plugin-scan"
path = "src/bin/scan.rs"

# A small CLAP plugin the tests load: a gain effect with a note-driven
# sine, and some state that isn't a parameter.
[[example]]
name = "test_plugin"
path = "examples/test_plugin.rs"
crate-type = ["cdylib"]

[dependencies]
noodle-core.workspace = true
noodle-engine.workspace = true
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-host", "params", "audio-ports", "note-ports", "state", "gui", "timer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
directories = "6.0.0"

# Native windows for embedded plugin editors (see `src/window`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
clack-plugin = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-plugin", "params", "audio-ports", "note-ports", "state", "gui", "timer"] }
tempfile = "3.27.0"
noodle-nodes.workspace = true
