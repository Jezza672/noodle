[package]
name = "noodle-app"
description = "The Noodle desktop application (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noodle-core.workspace = true
noodle-engine.workspace = true
noodle-nodes.workspace = true
noodle-io.workspace = true
noodle-plugins.workspace = true
noodle-stems = { workspace = true, features = ["onnx"] }
noodle-network.workspace = true
noodle-packs.workspace = true
noodle-publish.workspace = true
serde_json = "1"
eframe = "0.36.2"
rfd = "0.17.2"
egui = "0.36.2"
directories = "6.0.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
clipboard-rs = "0.3.5"

# Credentials for self-hosted sources go in the system keychain where there is
# one Noodle can use. Elsewhere they fall back to the preferences file.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
tempfile = "3.27.0"
noodle-network.workspace = true
