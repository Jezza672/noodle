[package]
name = "noodle-cli"
description = "Command-line tools: render a project to WAV."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "noodle"
path = "src/main.rs"

[dependencies]
noodle-core.workspace = true
noodle-engine.workspace = true
noodle-nodes.workspace = true
noodle-io.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
