[package]
name = "noodle-io"
description = "Audio and MIDI device I/O, audio file decoding and disk streaming."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18.2"
hound = "3.5.1"
midir = "0.11.1"
noodle-engine.workspace = true
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
noodle-core.workspace = true
