[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
noodle-core = { path = "crates/noodle-core" }
noodle-engine = { path = "crates/noodle-engine" }
noodle-nodes = { path = "crates/noodle-nodes" }
noodle-io = { path = "crates/noodle-io" }

# Unoptimised DSP is too slow to listen to, even while debugging.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
